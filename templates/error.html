{% extends "base.html" %}
{% block title %}Error {{ code }} - Nova Projects{% endblock %}
{% block body %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-canvas); padding: 2rem;">
    <div style="text-align: center; max-width: 32rem;">
        <div style="font-size: 6rem; font-weight: 700; color: var(--text-5); margin-bottom: 1rem;">{{ code }}</div>
        <h1 style="font-size: 2.25rem; font-weight: 700; color: var(--text-1); margin-bottom: 1rem;">{{ error }}</h1>
        <p style="font-size: 0.9375rem; color: var(--text-4); margin-bottom: 2rem;">The page you're looking for doesn't exist or an error occurred.</p>
        <a href="{{ url_for('home') if session.get('user_id') else url_for('login') }}" class="btn btn-primary">
            <i class="fa-solid fa-house"></i>
            Go Home
        </a>
    </div>
</div>
{% endblock %}
