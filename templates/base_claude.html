<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NOVA{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon-n.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon-n.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/claude-nova.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
