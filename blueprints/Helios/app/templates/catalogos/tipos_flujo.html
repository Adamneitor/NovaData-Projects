{% extends "base.html" %}
{% block titulo %}Tipos de flujo{% endblock %}
{% block contenido %}
<div class="if-head">
  <div class="if-head__text">
    <h1 class="if-head__title">Tipos de flujo</h1>
    <p class="if-head__sub">Categorías que agrupan los flujos BPM</p>
  </div>
</div>

<div class="if-split if-split--2">
  <div class="if-table">
    <div class="if-tr if-tr--head if-tr--tipo">
      <span>Tipo</span><span>Código</span><span></span>
    </div>
    {% for t in tipos %}
    <div class="if-tr if-tr--tipo {% if loop.index is even %}if-tr--alt{% endif %}">
      <span class="if-cell">{{ t.nombre }}</span>
      <span class="if-flujo">{{ t.id }}</span>
      <span></span>
    </div>
    {% else %}
    <div class="if-empty if-empty--bare">
      <div class="if-empty__box"><div class="if-empty__title">No hay tipos</div></div>
    </div>
    {% endfor %}
  </div>
  <div class="if-panel">
    <div class="if-panel__t">Nuevo tipo</div>
    <form method="post" action="/catalogos/tipos-flujo/crear">
      <div class="if-field">
        <label class="if-lbl" for="tipoNombre">Nombre</label>
        <input class="caso-input" id="tipoNombre" name="nombre" placeholder="Ej: Cobranza" required>
      </div>
      <button class="if-btn">Crear</button>
    </form>
  </div>
</div>
{% endblock %}
